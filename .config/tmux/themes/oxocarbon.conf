# Oxocarbon (dark) — tmux theme
# Ported from oxocarbon.nvim (nyoom-engineering)
# https://github.com/nyoom-engineering/oxocarbon.nvim
#
# Drop-in replacement for the Catppuccin block in ~/.tmux.conf.
# Use with:  source-file ~/.config/tmux/oxocarbon.conf

# --- Palette ---------------------------------------------------------------
color_bg="#161616"          # base00  background
color_blend="#131313"       # near-black blend
color_crust="#0b0b0b"       # darkest
color_surface_0="#262626"   # base01
color_surface_1="#393939"   # base02
color_surface_2="#525252"   # base03
color_overlay="#525252"     # base03
color_subtext="#d0d0d0"     # base04
color_text="#f2f2f2"        # base05
color_white="#ffffff"       # base06

color_teal="#08bdba"
color_cyan="#3ddbd9"
color_blue="#78a9ff"
color_blue_bright="#33b1ff"
color_light_blue="#82cfff"
color_pink="#ee5396"
color_pink_light="#ff7eb6"
color_green="#42be65"
color_purple="#be95ff"

# --- Command / message line ---------------------------------------------------
set -g message-style "fg=$color_text,bg=$color_surface_0"

# --- Status line ------------------------------------------------------------
set -g status-style "fg=$color_text,bg=$color_bg"
set -g status-left "#[fg=$color_blue]  #[fg=$color_text] #{server_sessions} #[default] "
set -g status-right "#[fg=$color_teal,bg=$color_bg]󱘊 #[fg=$color_text,bg=$color_bg] #(whoami)@#H#[default]"

set -g window-status-separator " "
set -g window-status-format "#[fg=$color_bg,bg=$color_surface_1] #I #[fg=$color_surface_2,bg=$color_surface_0] #{p6:window_name} #[default]"
set -g window-status-current-format "#[fg=$color_bg,bg=$color_pink] #I #[fg=$color_text,bg=$color_surface_1] #{p6:window_name} #[default]"

# --- Panes -----------------------------------------------------------------
set -g pane-border-style "fg=$color_surface_1"
set -g pane-active-border-style "fg=$color_blue"

# --- Copy / choose mode ----------------------------------------------------
set -g mode-style "fg=$color_bg,bg=$color_purple"

# --- Clock ---------------------------------------------------------------
set -g clock-mode-colour "$color_blue"
