# Oxocarbon Dark
# Ported from oxocarbon.nvim (nyoom-engineering) — https://github.com/nyoom-engineering/oxocarbon.nvim
# Palette (dark): base00 #161616  base01 #262626  base02 #393939  base03 #525252
#                 base04 #d0d0d0  base05 #f2f2f2  base06 #ffffff
#                 #08bdba #3ddbd9 #78a9ff #ee5396 #33b1ff #ff7eb6 #42be65 #be95ff #82cfff
# ANSI slots follow the plugin's own terminal_color_* mapping (deliberately blue/green-forward).

[colors.primary]
background      = "#161616"
foreground     = "#d0d0d0"
dim_foreground  = "#525252"
bright_foreground = "#f2f2f2"

[colors.cursor]
text   = "#161616"
cursor = "#d0d0d0"

[colors.vi_mode_cursor]
text   = "#161616"
cursor = "#33b1ff"

[colors.search.matches]
foreground = "#161616"
background = "#78a9ff"

[colors.search.focused_match]
foreground = "#161616"
background = "#42be65"

[colors.footer_bar]
foreground = "#d0d0d0"
background = "#262626"

[colors.hints.start]
foreground = "#161616"
background = "#33b1ff"

[colors.hints.end]
foreground = "#161616"
background = "#78a9ff"

[colors.selection]
text       = "CellForeground"
background = "#393939"

[colors.normal]
black   = "#262626"
red     = "#33b1ff"
green   = "#be95ff"
yellow  = "#42be65"
blue    = "#78a9ff"
magenta = "#82cfff"
cyan    = "#3ddbd9"
white   = "#f2f2f2"

[colors.bright]
black   = "#525252"
red     = "#33b1ff"
green   = "#be95ff"
yellow  = "#42be65"
blue    = "#78a9ff"
magenta = "#82cfff"
cyan    = "#08bdba"
white   = "#ffffff"

[[colors.indexed_colors]]
index = 16
color = "#ee5396"

[[colors.indexed_colors]]
index = 17
color = "#ff7eb6"
